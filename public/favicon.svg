<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1945"/>
      <stop offset="50%" stop-color="#0e2a7a"/>
      <stop offset="100%" stop-color="#070d1e"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Rounded Background Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Stylized 'A' Newspaper Icon -->
  <path d="M 256 80 L 110 400 L 180 400 L 220 310 L 292 310 L 332 400 L 402 400 Z" fill="url(#redGrad)"/>
  <!-- Inner A bar -->
  <polygon points="256,180 232,250 280,250" fill="#FFFFFF"/>

  <!-- Gold Star Accent for Editorial Excellence -->
  <circle cx="380" cy="140" r="32" fill="url(#goldGrad)"/>
  <polygon points="380,116 388,132 404,140 388,148 380,164 372,148 356,140 372,132" fill="#FFFFFF"/>
</svg>
